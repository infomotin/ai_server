{% extends "base.html" %}
{% block title %}OpenLocalAI - Login{% endblock %}
{% block header_title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="card">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-sign-in-alt text-white text-xl"></i>
            </div>
            <h2 class="text-xl font-bold text-white">Sign In</h2>
            <p class="text-gray-500 text-sm mt-1">Access your OpenLocalAI account</p>
        </div>
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
                <input type="email" name="email" required class="input-field" placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                <input type="password" name="password" required class="input-field" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            </div>
            <button type="submit" class="btn btn-primary w-full py-2.5"><i class="fas fa-sign-in-alt mr-2"></i>Sign In</button>
        </form>
        <p class="text-center text-gray-500 text-sm mt-4">Don't have an account? <a href="/register" class="text-blue-400 hover:text-blue-300">Register</a></p>
    </div>
</div>
{% endblock %}
